apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: registry.example.com/shop:1.4.0
          args: ["-admin-addr=:9090", "-addr=:8000"]
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9090
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: shop-api
                  key: token
          startupProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /livez
              port: admin
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
        - name: metrics-sidecar
          image: registry.example.com/metrics-agent:2.0.0
          args: ["--scrape=localhost:9090"]
---
